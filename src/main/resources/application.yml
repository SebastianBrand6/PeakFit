server:
  port: ${SERVER_PORT:8080}
  error: 
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/PeakFit?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Luisa1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

peakfit:
  gym:
    max-capacity: 100
    moderate-threshold-percent: 50
    high-threshold-percent: 80
    critical-threshold-percent: 95